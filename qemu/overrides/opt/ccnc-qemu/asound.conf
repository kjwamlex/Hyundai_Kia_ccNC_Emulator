# Generic stereo output for the output-only QEMU HDA codec.
# No capture PCM is provided by this lab environment.
pcm.qemu_mix {
    type dmix
    ipc_key 428
    ipc_perm 0666
    slave {
        pcm "hw:0,0"
        rate 48000
        format S16_LE
        channels 2
        period_size 1024
        buffer_size 8192
    }
}
pcm.!default { type plug; slave.pcm "qemu_mix" }
ctl.!default { type hw; card 0 }
pcm.AV1_OUT { type plug; slave.pcm "qemu_mix" }
pcm.HD_OUT { type plug; slave.pcm "qemu_mix" }
pcm.NAVI_OUT { type plug; slave.pcm "qemu_mix" }
pcm.NAVI_WARNING_OUT { type plug; slave.pcm "qemu_mix" }

pcm.qemu_media_gain {
    type softvol
    slave.pcm "qemu_mix"
    control { name "QEMU_media"; card 0 }
    min_dB -50.0
    max_dB 0.0
    resolution 101
}
pcm.qemu_media { type plug; slave.pcm "qemu_media_gain" }

pcm.qemu_beep_gain {
    type softvol
    slave.pcm "qemu_mix"
    control { name "QEMU_beep"; card 0 }
    min_dB -50.0
    max_dB 0.0
    resolution 101
}
pcm.qemu_beep { type plug; slave.pcm "qemu_beep_gain" }

pcm.qemu_navi_gain {
    type softvol
    slave.pcm "qemu_mix"
    control { name "QEMU_navi"; card 0 }
    min_dB -50.0
    max_dB 0.0
    resolution 101
}
pcm.qemu_navi { type plug; slave.pcm "qemu_navi_gain" }
